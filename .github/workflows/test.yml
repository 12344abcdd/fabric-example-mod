name: test and push

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Cache Gradle dependencies
        uses: actions/cache@v6.0.0
        with:
          path: |
            ~/.gradle/caches
            ./.gradle
          key: gradle
          restore-keys: |
            gradle
          upload-chunk-size: 10485760
          enableCrossOsArchive: false
          fail-on-cache-miss: false
          lookup-only: false
          save-always: false
    
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run gradlew setup
        run: ./gradlew setup >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Run gradlew build
        run: ./gradlew build >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Force overwrite out branch with all current files
        run: |
          git checkout --orphan temp_out
          git add --force .
          git commit -m "Build snapshot $GITHUB_SHA"
          git push origin temp_out:out --force
