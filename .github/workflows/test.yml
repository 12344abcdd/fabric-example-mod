name: test and push

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run gradlew build
        run: ./gradlew build

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Force overwrite out branch with all current files
        run: |
          # 新建干净孤儿分支，彻底清空历史
          git checkout --orphan temp_out
          # 强制添加当前目录所有文件（包含隐藏文件）
          git add --force .
          git commit -m "Build snapshot $GITHUB_SHA"
          # 强制覆盖远端 out 分支
          git push origin temp_out:out --force
          # 删除本地临时分支
          git checkout main
          git branch -D temp_out
