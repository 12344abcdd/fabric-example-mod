name: test and push

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-force-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run gradlew build
        run: ./gradlew gensources build

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Force overwrite out branch with all current files
        run: |
          # æ°å»ºå¹²åå­¤å¿åæ¯ï¼å½»åºæ¸ç©ºåå²
          git checkout --orphan temp_out
          # å¼ºå¶æ·»å å½åç®å½æææä»¶ï¼åå«éèæä»¶ï¼
          git add --force .
          git commit -m "Build snapshot $GITHUB_SHA"
          # å¼ºå¶è¦çè¿ç«¯ out åæ¯
          git push origin temp_out:out --force
