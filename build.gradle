plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {

}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import net.fabricmc.loom.api.LoomGradleExtensionAPI
import net.fabricmc.loom.task.GenerateSourcesTask
import java.lang.reflect.Method
import java.nio.file.Path

tasks.register("setup") {
    group = "loom"
    description = "Run genSources & extract MC common to src/main/java, client to src/client/java"
    dependsOn("genSources")

    doLast {
        // 存储两个源码Jar
        File commonSrcJar = null
        File clientSrcJar = null

        // 遍历所有 GenerateSourcesTask，区分 common / client
        tasks.withType(GenerateSourcesTask).each { GenerateSourcesTask task ->
            String jarName = task.getInputJarName().get()
            File jar = task.getSourcesOutputJar().getAsFile()
            println("Found decompile task [${task.name}] jarName=${jarName} path=${jar}")

            if (jarName == "minecraft-common") {
                commonSrcJar = jar
            } else if (jarName == "minecraft-client") {
                clientSrcJar = jar
            }
        }

        // 校验文件存在
        if (!commonSrcJar?.exists()) {
            throw new RuntimeException("Common sources jar not found, run ./gradlew genSources first")
        }
        if (!clientSrcJar?.exists()) {
            throw new RuntimeException("Client sources jar not found, run ./gradlew genSources first")
        }

        // 目标目录
        File targetCommon = file("src/main/java")
        File targetClient = file("src/client/java")

        // 清空原版MC源码（注释两行保留自己mod代码）
        delete(targetCommon)
        delete(targetClient)
        targetCommon.mkdirs()
        targetClient.mkdirs()

        // 解压 common -> src/main/java
        copy {
            from zipTree(commonSrcJar)
            into targetCommon
        }
        println("✅ Extracted common Minecraft sources to ${targetCommon.absolutePath}")

        // 解压 client -> src/client/java
        copy {
            from zipTree(clientSrcJar)
            into targetClient
        }
        println("✅ Extracted client Minecraft sources to ${targetClient.absolutePath}")
    }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
