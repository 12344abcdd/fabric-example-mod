plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {

}

loom {
	splitEnvironmentSourceSets()

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

import net.fabricmc.loom.api.LoomGradleExtensionAPI
import net.fabricmc.loom.task.GenerateSourcesTask
import java.lang.reflect.Method
import java.nio.file.Path

tasks.register("setup") {
    group = "loom"
    description = "Run genSources & extract MC common to src/main/java, client to src/client/java"
    // 先执行源码生成任务
    dependsOn("genCommonSources", "genClientSources")

    doLast {
        LoomGradleExtensionAPI loom = project.extensions.getByType(LoomGradleExtensionAPI)

        // 1. 获取 common 源码任务 genSources
        GenerateSourcesTask commonGenTask = tasks.named("genCommonSources", GenerateSourcesTask).get()
        File commonSrcJar = commonGenTask.getSourcesOutputJar().getAsFile()
        println("Common sources jar path: " + commonSrcJar.absolutePath)

        // 2. 获取 client 源码任务 genSourcesClient
        GenerateSourcesTask clientGenTask = tasks.named("genClientSources", GenerateSourcesTask).get()
        File clientSrcJar = clientGenTask.getSourcesOutputJar().getAsFile()
        println("Client sources jar path: " + clientSrcJar.absolutePath)

        // 目标源码目录
        File targetCommon = file("src/main/java")
        File targetClient = file("src/client/java")

        // 清空旧MC源码，注释两行保留自己写的mod代码
        delete(targetCommon)
        delete(targetClient)
        targetCommon.mkdirs()
        targetClient.mkdirs()

        // 解压 common 到 main
        copy {
            from zipTree(commonSrcJar)
            into targetCommon
        }
        println("✅ Extracted common Minecraft sources to ${targetCommon.absolutePath}")

        // 解压 client 到 client
        copy {
            from zipTree(clientSrcJar)
            into targetClient
        }
        println("✅ Extracted client Minecraft sources to ${targetClient.absolutePath}")
    }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
